# Проверки на каждый push и pull request: типы, тесты, ядро прайс-чека PoE2, поиск секретов.
# Релиз по тегу v* — отдельно (release.yml).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Поиск секретов
        run: node tools/ci/scan-secrets.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:trade
      - run: npm run build
