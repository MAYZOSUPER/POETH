# Релиз по тегу v* (S10a, S10b): проверки → в GitHub Releases POETH-Setup-<версия>.exe + .blockmap +
# latest.yml (автообновление установленной версии) и POETH-Portable-<версия>.exe. Описание релиза —
# build/release-notes.md (RU/EN, electron-builder.yml → releaseInfo). Собирает electron-builder, публикует gh
# (см. шаг «Публикация»). Токен — встроенный GITHUB_TOKEN этого запуска, в сборку он не попадает (только
# переменная окружения шага публикации).
#
# Выпуск: поднять "version" в package.json и обновить build/release-notes.md (версия + «что нового»)
# → commit → git tag v<версия> → git push --tags.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Тег совпадает с версией package.json
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "тег $GITHUB_REF_NAME, а в package.json $v"; exit 1; fi
      - name: Описание релиза обновлено (build/release-notes.md)
        shell: bash
        run: |
          grep -qF "**POETH $GITHUB_REF_NAME**" build/release-notes.md || { echo "в build/release-notes.md нет «**POETH $GITHUB_REF_NAME**» — обновите «что нового»"; exit 1; }
      - name: Поиск секретов
        run: node tools/ci/scan-secrets.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:trade
      # S44: движок PoB — урезанный PoB и luajit.exe только из закреплённых исходников (tools/pob/pins.json, SHA-256),
      # luajit.exe собирается здесь MSVC раннера; затем настоящий движок: песочница изнутри, расчёт, RU = EN
      - name: Движок PoB (сборка из исходников по пинам)
        run: node tools/pob/prepare.mjs
      - name: Движок PoB (проверка)
        run: npx vitest run tests/pob/serverLua.test.ts
      - run: npm run build
      # electron-builder только собирает. Его публикация (--publish always) в 26.x создаёт ДВА релиза с одним тегом:
      # издатель создаётся асинхронно (с PR #9581), Setup и его blockmap грузятся одновременно, и каждый заводит
      # свой релиз. В rc.12 blockmap попал в отдельный релиз, /releases/download/<тег>/…blockmap — 404, обновление
      # с rc.11 качает Setup целиком. Исправлено только в v27 (PR #10028).
      - name: Сборка (Setup + blockmap + latest.yml, Portable)
        run: npx electron-builder --win --publish never
      # Один релиз одним вызовом: gh создаёт черновик, загружает все файлы и только потом публикует — electron-updater
      # не увидит релиз без latest.yml или blockmap. Нет любого из четырёх файлов — шаг падает, релиза нет.
      # Название — версия, описание — build/release-notes.md (как делал electron-builder). --latest обязателен:
      # установленные версии ищут обновление по /releases/latest (src/main/services/updaterPolicy.ts).
      - name: Публикация в GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$v" --notes-file build/release-notes.md \
            "dist-release/POETH-Setup-$v.exe" \
            "dist-release/POETH-Setup-$v.exe.blockmap" \
            "dist-release/latest.yml" \
            "dist-release/POETH-Portable-$v.exe"
          # как файлы увидит electron-updater — по ссылке тега (в rc.12 blockmap здесь отдавал 404)
          for f in "POETH-Setup-$v.exe" "POETH-Setup-$v.exe.blockmap" latest.yml "POETH-Portable-$v.exe"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$f")
            echo "$code $f"; [ "$code" = 302 ] || exit 1
          done
