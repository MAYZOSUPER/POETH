# Релиз по тегу v* (S10a, S10b): проверки → в GitHub Releases POETH-Setup-<версия>.exe + .blockmap +
# latest.yml (автообновление установленной версии) и POETH-Portable-<версия>.exe. Описание релиза —
# build/release-notes.md (RU/EN, electron-builder.yml → releaseInfo). Токен — встроенный GITHUB_TOKEN
# этого запуска, в сборку он не попадает (только переменная окружения шага публикации).
#
# Выпуск: поднять "version" в package.json и обновить build/release-notes.md (версия + «что нового»)
# → commit → git tag v<версия> → git push --tags.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Тег совпадает с версией package.json
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "тег $GITHUB_REF_NAME, а в package.json $v"; exit 1; fi
      - name: Описание релиза обновлено (build/release-notes.md)
        shell: bash
        run: |
          grep -qF "**POETH $GITHUB_REF_NAME**" build/release-notes.md || { echo "в build/release-notes.md нет «**POETH $GITHUB_REF_NAME**» — обновите «что нового»"; exit 1; }
      - name: Поиск секретов
        run: node tools/ci/scan-secrets.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:trade
      # S44: движок PoB — урезанный PoB и luajit.exe только из закреплённых исходников (tools/pob/pins.json, SHA-256),
      # luajit.exe собирается здесь MSVC раннера; затем настоящий движок: песочница изнутри, расчёт, RU = EN
      - name: Движок PoB (сборка из исходников по пинам)
        run: node tools/pob/prepare.mjs
      - name: Движок PoB (проверка)
        run: npx vitest run tests/pob/serverLua.test.ts
      - run: npm run build
      - name: Сборка и публикация (Setup + blockmap + latest.yml, Portable)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
