appId: com.poeth.app
productName: POETH
copyright: Copyright © 2026 POETH contributors

directories:
  output: dist-release
  buildResources: build

# Electron fuses (hardening, S3): cookie encryption, без RunAsNode/--inspect, только app.asar + integrity.
afterPack: build/afterPack.cjs

files:
  - out/**/*
  - package.json

# Автообновление (S10a): релизы GitHub MAYZOSUPER/POETH. В сборку кладётся app-update.yml,
# в релиз — latest.yml + установщик (CI: .github/workflows/release.yml, --publish always).
publish:
  provider: github
  owner: MAYZOSUPER
  repo: POETH
  releaseType: release

# Нативные модули — N-API prebuilds (electron-overlay-window, uiohook-napi): пересборка под Electron
# не нужна. Без npmRebuild:false electron-builder собирает .node из исходников (нужен MSVC, ломается
# на пробелах в пути) — проверено в S1: упакованная сборка на одних prebuilds работает.
npmRebuild: false

# Нативные модули должны лежать вне app.asar, иначе .node не загрузится.
asarUnpack:
  - "**/node_modules/electron-overlay-window/**"
  - "**/node_modules/uiohook-napi/**"

extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: POE Trade Helper
