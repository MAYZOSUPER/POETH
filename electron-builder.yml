appId: com.poeth.app
productName: POETH
copyright: Copyright © 2026 POETH contributors

directories:
  output: dist-release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: POE Trade Helper
